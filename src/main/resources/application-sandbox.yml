# 沙箱模式：H2 内存数据库 + Mock AI 网关，离线可跑
spring:
  datasource:
    url: jdbc:h2:mem:dualrecord;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      continue-on-error: false

dual-record:
  ai-gateway:
    providers:
      - name: mock
        weight: 100
        model: mock-llm-v1
        endpoint: local://mock
  recording:
    allow-pause: true  # 沙箱模式允许暂停调试
