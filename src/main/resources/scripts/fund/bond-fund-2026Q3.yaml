product_id: FND-BOND-2026Q3-001
product_name: 纯债债券型基金
product_type: FUND_BOND
fund_code: "00XXXXX"
risk_level: R2
min_purchase: "1000"

target_customer:
  min_risk_tolerance: C2
  fund_investor_type: "普通投资者"

regulatory_refs:
  - 证券投资基金销售适用性指导意见
  - 基金募集机构投资者适当性管理实施指引
  - 金融机构产品适当性管理办法
  - 金发〔2026〕8号

nodes:
  - node_id: 01-identity
    display_name: 出示身份证明
    duration_sec: 30
    mandatory_phrases:
      - "您好，我是基金销售员 XXX，从业资格证号 XXXX"
      - "请出示您的身份证件"
    operator_role: SELLER

  - node_id: 02-disclosure
    display_name: 风险揭示
    duration_sec: 90
    mandatory_phrases:
      - "基金有风险，投资须谨慎"
      - "本基金为债券型基金，主要投资于国债、金融债等固定收益类资产"
      - "基金净值会随市场波动，过往业绩不代表未来表现"
    critical: true

  - node_id: 03-product
    display_name: 产品展示
    duration_sec: 60
    mandatory_phrases:
      - "本基金为纯债债券型基金"
      - "基金代码 XXXXXX"
      - "起购金额 1000 元"
      - "业绩比较基准：中债-综合财富(1-3年)指数收益率 × 90% + 1 年定存 × 10%"

  - node_id: 04-rights
    display_name: 权利义务告知
    duration_sec: 45
    mandatory_phrases:
      - "本基金不保证保本及最低收益"
      - "请仔细阅读基金合同、招募说明书等法律文件"
      - "您有权在 T+1 日申请赎回"

  - node_id: 05-truth-tell
    display_name: 如实告知询问
    duration_sec: 60
    required_questions:
      - 您是否已阅读基金合同和招募说明书？
      - 您是否已了解本基金的投资范围和风险特征？
      - 您的风险承受能力等级是否与本基金匹配？

  - node_id: 06-confirm
    display_name: 明确肯定答复
    duration_sec: 20
    mandatory_phrases:
      - "您是否已了解基金净值会随市场波动？"
      - "您是否已了解本基金的投资范围和风险特征？"
    critical: true
    require_asr_affirmative: true
    require_human_dual_sign: true

  - node_id: 07-sign
    display_name: 签署基金交易申请
    duration_sec: 45
    documents:
      - 基金交易申请书
      - 风险揭示书
    require_ca_signature: true

  - node_id: 08-followup
    display_name: 补充询问
    duration_sec: 20

forbidden_phrases:
  - "保本"
  - "无风险"
  - "承诺收益"
  - "稳赚不赔"
  - "一定盈利"
  - "肯定不亏"

required_questions:
  - 您是否已阅读基金合同和招募说明书？
  - 您是否已了解本基金的投资范围和风险特征？
  - 您的风险承受能力等级是否与本基金匹配？
  - 您了解基金净值会随市场波动？

channel_overrides:
  OFFLINE:
    sync_mode: same_frame
  REMOTE_VIDEO:
    sync_mode: same_frame
  SELF_AI:
    sync_mode: ai_with_disclosure
    ai_disclosure: per_minute
    watermark_visible: true
  INTERNET_TEXT:
    sync_mode: text_only
