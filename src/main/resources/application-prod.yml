# 生产模式：MySQL/MariaDB + 真实 AI 网关
spring:
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/dualrecord?useUnicode=true&characterEncoding=utf8mb4}
    driver-class-name: ${DB_DRIVER:org.mariadb.jdbc.Driver}
    username: ${DB_USER:dualrecord}
    password: ${DB_PASSWORD:changeit}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
  sql:
    init:
      mode: never  # 生产模式不自动初始化
